<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>RIDGE — Gear for the long way round</title>
    <style>
        :root {
            --bg: #F7F5F0;
            --ink: #1B2420;
            --accent: #FF5A1F;
            --moss: #3C5844;
            --line: #D8D3C6;
            --card: #FFFFFF;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #14180F;
                --ink: #EDEAE0;
                --card: #1E2418;
                --line: #333B2C;
            }
        }

        :root[data-theme="dark"] {
            --bg: #14180F;
            --ink: #EDEAE0;
            --card: #1E2418;
            --line: #333B2C;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .display {
            font-family: 'Barlow Condensed', Inter, sans-serif;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        a {
            color: inherit;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            padding: 16px 24px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            letter-spacing: 0.04em;
        }

        .logo span {
            color: var(--accent);
        }

        #cart-btn {
            background: none;
            border: 1px solid var(--ink);
            color: var(--ink);
            padding: 8px 14px;
            border-radius: 2px;
            font-size: 14px;
            cursor: pointer;
            position: relative;
        }

        #cart-count {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
        }

        .hero {
            padding: 64px 24px 48px;
            max-width: 1100px;
            margin: 0 auto;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, var(--line) 40px);
            background-size: 100% 40px;
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 84px);
            line-height: 0.95;
            max-width: 14ch;
        }

        .hero p {
            max-width: 46ch;
            margin-top: 18px;
            font-size: 16px;
            opacity: 0.8;
            line-height: 1.5;
        }

        .controls {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filters button {
            background: none;
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .filters button.active {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink);
        }

        #sort {
            background: var(--bg);
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .grid {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .thumb {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #EAE6DF;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .thumb img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .cat {
            font-size: 11px;
            opacity: 0.55;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .name {
            font-size: 17px;
            font-weight: 600;
        }

        .spec {
            font-size: 12px;
            opacity: 0.6;
            font-family: ui-monospace, Menlo, monospace;
        }

        .row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
        }

        .price {
            font-size: 16px;
            font-weight: 600;
        }

        .add-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 2px;
            font-size: 13px;
            cursor: pointer;
        }

        .add-btn:active {
            transform: scale(0.97);
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 20;
        }

        #overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: min(380px, 90vw);
            background: var(--bg);
            border-left: 1px solid var(--line);
            transform: translateX(100%);
            transition: transform .25s ease;
            z-index: 21;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        #drawer.show {
            transform: translateX(0);
        }

        .drawer-head {
            padding: 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-head button {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--ink);
            cursor: pointer;
        }

        #cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
        }

        .cart-row {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            align-items: center;
        }

        .cart-row .thumb-sm {
            width: 48px;
            height: 48px;
            border-radius: 2px;
            flex-shrink: 0;
            overflow: hidden;
            background: #EAE6DF;
        }

        .cart-row .thumb-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-info {
            flex: 1;
            font-size: 13px;
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .qty button {
            width: 22px;
            height: 22px;
            border: 1px solid var(--line);
            background: none;
            color: var(--ink);
            cursor: pointer;
            border-radius: 2px;
        }

        .remove {
            font-size: 11px;
            opacity: 0.5;
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            color: inherit;
            margin-left: 4px;
        }

        .drawer-foot {
            padding: 20px;
            border-top: 1px solid var(--line);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 14px;
        }

        .checkout-btn {
            width: 100%;
            background: var(--ink);
            color: var(--bg);
            border: none;
            padding: 13px;
            font-size: 15px;
            border-radius: 2px;
            cursor: pointer;
        }

        .empty {
            opacity: 0.5;
            font-size: 14px;
            padding: 30px 0;
            text-align: center;
        }

        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 24px 50px;
            font-size: 12px;
            opacity: 0.5;
            border-top: 1px solid var(--line);
        }

        @media(max-width:480px) {
            .hero {
                padding: 40px 20px 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo display">RIDGE<span>.</span></div>
        <button id="cart-btn" onclick="toggleDrawer(true)">Cart<span id="cart-count">0</span></button>
    </header>

    <section class="hero">
        <h1 class="display">Gear built for the long way round.</h1>
        <p>Field-tested packs, shells and boots — designed for the trail, priced for the trip. Free returns within 60
            days.</p>
    </section>

    <div class="controls">
        <div class="filters" id="filters"></div>
        <select id="sort" onchange="render()">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
        </select>
    </div>

    <div class="grid" id="grid"></div>

    <footer>© 2026 Ridge Supply Co. — Portfolio demo project.</footer>

    <div id="overlay" onclick="toggleDrawer(false)"></div>
    <div id="drawer">
        <div class="drawer-head"><span class="display" style="font-size:20px">Your cart</span><button
                onclick="toggleDrawer(false)">✕</button></div>
        <div id="cart-items"></div>
        <div class="drawer-foot">
            <div class="total-row"><span>Total</span><strong id="cart-total">$0</strong></div>
            <button class="checkout-btn" onclick="alert('Demo checkout — no payment processed.')">Checkout</button>
        </div>
    </div>

    <script>
        const PRODUCTS = [
            { id: 1, name: 'Cairn Shell Jacket', cat: 'jacket', price: 189, spec: '3-layer / 340g', image: 'https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&w=600&q=80' },
            { id: 2, name: 'Switchback Down Jacket', cat: 'jacket', price: 229, spec: '700-fill / 410g', image: 'https://images.unsplash.com/photo-1548883354-7622d03aca27?auto=format&fit=crop&w=600&q=80' },
            { id: 3, name: 'Traverse 38L Pack', cat: 'pack', price: 159, spec: '38L / ripstop nylon', image: 'https://images.unsplash.com/photo-1622560480605-d83c853bc5c3?auto=format&fit=crop&w=600&q=80' },
            { id: 4, name: 'Basecamp Duffel', cat: 'pack', price: 99, spec: '60L / waxed canvas', image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80' },
            { id: 5, name: 'Alpine Daypack', cat: 'pack', price: 79, spec: '20L / 480g', image: 'https://images.unsplash.com/photo-1509762774915-6ad9780807ff?auto=format&fit=crop&w=600&q=80' },
            { id: 6, name: 'Granite Hiking Boot', cat: 'boot', price: 169, spec: 'waterproof / vibram sole', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80' },
            { id: 7, name: 'Ridgeline Trail Runner', cat: 'boot', price: 129, spec: 'mesh / 280g', image: 'https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=600&q=80' },
            { id: 8, name: 'Compass Wool Beanie', cat: 'accessory', price: 29, spec: 'merino / one size', image: 'https://images.unsplash.com/photo-1576871337622-98d48d1cf531?auto=format&fit=crop&w=600&q=80' },
            { id: 9, name: 'Summit Trekking Poles', cat: 'accessory', price: 59, spec: 'carbon / pair', image: 'https://images.unsplash.com/photo-1627884010078-21d1d8cfdd26?auto=format&fit=crop&w=600&q=80' },
        ];

        let cart = JSON.parse(localStorage.getItem('ridge_cart') || '{}');
        let activeCat = 'all';

        function saveCart() { localStorage.setItem('ridge_cart', JSON.stringify(cart)); updateCartUI(); }

        function renderFilters() {
            const cats = ['all', 'jacket', 'pack', 'boot', 'accessory'];
            const labels = { all: 'All', jacket: 'Jackets', pack: 'Packs', boot: 'Footwear', accessory: 'Accessories' };
            document.getElementById('filters').innerHTML = cats.map(c =>
                `<button class="${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${labels[c]}</button>`).join('');
        }
        function setCat(c) { activeCat = c; render(); }

        function render() {
            renderFilters();
            let items = activeCat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);
            const sort = document.getElementById('sort').value;
            if (sort === 'low') items = [...items].sort((a, b) => a.price - b.price);
            if (sort === 'high') items = [...items].sort((a, b) => b.price - a.price);
            document.getElementById('grid').innerHTML = items.map(p => `
    <div class="card">
      <div class="thumb">
        <img src="${p.image}" alt="${p.name}" loading="lazy" />
      </div>
      <div class="card-body">
        <span class="cat">${p.cat}</span>
        <span class="name">${p.name}</span>
        <span class="spec">${p.spec}</span>
        <div class="row">
          <span class="price">$${p.price}</span>
          <button class="add-btn" onclick="addToCart(${p.id})">Add</button>
        </div>
      </div>
    </div>`).join('');
        }

        function addToCart(id) { cart[id] = (cart[id] || 0) + 1; saveCart(); toggleDrawer(true); }
        function changeQty(id, d) {
            cart[id] = (cart[id] || 0) + d;
            if (cart[id] <= 0) delete cart[id];
            saveCart();
        }
        function removeItem(id) { delete cart[id]; saveCart(); }

        function updateCartUI() {
            const ids = Object.keys(cart);
            document.getElementById('cart-count').textContent = ids.reduce((s, id) => s + cart[id], 0);
            const list = document.getElementById('cart-items');
            if (ids.length === 0) { list.innerHTML = '<div class="empty">Your cart is empty.</div>'; }
            else {
                list.innerHTML = ids.map(id => {
                    const p = PRODUCTS.find(x => x.id == id);
                    return `<div class="cart-row">
        <div class="thumb-sm"><img src="${p.image}" alt="${p.name}" /></div>
        <div class="cart-info">
          <div>${p.name}</div>
          <div class="qty">
            <button onclick="changeQty(${id},-1)">−</button>${cart[id]}<button onclick="changeQty(${id},1)">+</button>
            <button class="remove" onclick="removeItem(${id})">remove</button>
          </div>
        </div>
        <div style="font-weight:600">$${p.price * cart[id]}</div>
      </div>`;
                }).join('');
            }
            const total = ids.reduce((s, id) => s + PRODUCTS.find(x => x.id == id).price * cart[id], 0);
            document.getElementById('cart-total').textContent = '$' + total;
        }

        function toggleDrawer(open) {
            document.getElementById('drawer').classList.toggle('show', open);
            document.getElementById('overlay').classList.toggle('show', open);
        }

        render();
        updateCartUI();
    </script>
</body>

</html>
